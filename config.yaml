# Image-Choice Preference Evals — config
#
# `seed` is the single root of every random draw in this project (shuffles,
# snapshot construction, trajectory selection). Runs are reproducible from
# this file alone plus the recorded per-run seed in each JSONL row.

seed: 20260814
temperature: 1.0
image_size: 256   # stimuli are 256x256, not the 512x512 in the original spec draft

paths:
  images_source_dir: images            # manually-placed originals, descriptive names
  images_processed_dir: images_processed  # hashed, neutral-named copies the models actually see
  stimuli_json: stimuli.json
  data_dir: data                          # raw JSONL, one file per (eval, model)
  transcripts_dir: transcripts            # readable Markdown rendering of the above
  results_dir: results

openrouter:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  max_retries: 6
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0
  request_timeout_seconds: 120
  concurrency: 5

# 4 models, 4 distinct labs. Verify these slugs are still live on OpenRouter
# before scaling up (`openrouter/models` API or the website) -- pin exact
# dated snapshots if you want maximum reproducibility.
# All four verified live on OpenRouter with image input support, and priced
# (per 1M tokens, in/out) as of 2026-08-14:
#   luna    $0.10 / $0.60      qwen    $0.03 / $0.13
#   inkling $0.45 / $1.20      gemini  $0.375 / $1.875
#
# `reasoning`: these prompts want a reaction and two numbers, not deep
# chain-of-thought, and reasoning tokens are actively harmful here -- they eat
# the max_tokens budget before the model reaches the visible answer, which
# shows up as an empty response with finish_reason=length (measured: qwen
# burned all 1201 completion tokens on reasoning and returned no content at
# all, on 10/10 calls). So reasoning is disabled by default. Gemini's endpoint
# rejects that ("Reasoning is mandatory for this endpoint"), so it gets the
# lowest effort setting instead and a budget big enough to think and still
# answer.
reasoning_default: {enabled: false}

models:
  - id: openai/gpt-5.6-luna
    label: luna
  - id: qwen/qwen3.7-flash              # open-weight, for reproducibility
    label: qwen
  - id: thinkingmachines/inkling-small
    label: inkling
  - id: google/gemini-3.7-flash
    label: gemini
    reasoning: {effort: low}            # cannot be disabled on this endpoint

eval1:
  n_per_image: 30
  max_tokens: 1200

eval2:
  n_snapshots: 20
  trials_per_snapshot: 10   # 20 x 10 = 200 trials/model
  max_tokens: 1200

eval3:
  # 40, not the spec's 30: snapshots are position-balanced (see
  # common/exposure.balanced_snapshot), and exact pairwise balance needs a
  # multiple of 2*10. n=30 leaves a 0.133 residual; 40 is exact and buys
  # power for the eval3-vs-eval4 paired test.
  n_trajectories: 40

  # 13, not 10, and NOT announced to the model.
  #
  # With 10 announced choices over 10 images, 34 of 40 trajectories toured
  # every image exactly once -- which is uninterpretable, since a genuine
  # "see everything" drive and a tidy 10-slots-for-10-images mapping predict
  # identical data. 13 is past the point where coverage can be completed, so
  # the last few choices have to be repeats and reveal what the model returns
  # to. Withholding the count additionally removes the ability to schedule a
  # complete tour at all.
  #
  # Checked before changing it: announcing 1 choice (eval2) vs 10 (eval3)
  # produced statistically indistinguishable FIRST choices (chi2 p=0.14,
  # tech-vs-rest Fisher p=0.44), so the horizon is not doing work at turn 1
  # and this change is aimed squarely at the later turns.
  n_choices: 13
  announce_horizon: false
  max_tokens: 1200

eval4:
  n_trajectories: 40   # must equal eval3.n_trajectories -- seeds are matched 1:1
